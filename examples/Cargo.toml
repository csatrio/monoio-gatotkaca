[package]
edition.workspace = true
license.workspace = true
name = "monoio-examples"
publish = false
version = "0.0.0"

# If you copy one of the examples into a new project, you should be using
# [dependencies] instead. In additional, if you want to know how runtime
# works, you can enable "debug" feature.
[dev-dependencies]
monoio = { workspace = true, features = [
    "async-cancel",
    "sync",
    "bytes",
    "macros",
    "utils",
    "tls-rustls",
    "tls-native",
] }

# Enable tracing and tracing-subscriber for print out runtime debug
# tracing information. Add these only when you enable "debug" feature.
# tracing = "0.1"
# tracing-subscriber = "0.3"

futures = "0.3"
# crypto provider for the rustls examples
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
native-tls = "0.2"
local-sync = "0.1"
pin-project-lite = "0.2"

[[example]]
name = "accept"
path = "accept.rs"

