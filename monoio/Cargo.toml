[package]
authors.workspace = true
categories = ["asynchronous", "network-programming"]
description = "Stripped-down, Linux-only, io_uring-only thread-per-core async runtime (a fork of Monoio) used by the adaptif-gatotkaca transport system."
edition.workspace = true
keywords.workspace = true
license.workspace = true
name = "adaptif-gatotkaca-monoio"
readme = "README.md"
repository.workspace = true
version = "0.7.0"

# The library keeps the name `monoio` so `use monoio::..` and the macros keep working.
[lib]
name = "monoio"

# common dependencies
[dependencies]
# Lock-free Treiber stack, cache padding and CAS backoff for `uring::event_channel`.
adaptif-gatotkaca-utils = "0.11.1"
crossbeam-utils = "0.8"
monoio-macros = { workspace = true, optional = true }

auto-const-array = "0.2.2"
rustc-hash = "2.1.3"
libc = "0.2.191"
pin-project-lite = "0.2.17"
socket2 = { version = "0.6.5", features = ["all"] }
memchr = "2.8.3"

bytes = { version = "1.12.1", optional = true }
flume = { version = "0.12.0", optional = true }
threadpool = { version = "1.8.1", optional = true }
tracing = { version = "0.1.44", default-features = false, features = [
    "std",
], optional = true }
ctrlc = { version = "3.5.2", optional = true }
once_cell = { version = "1.21.4", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "logging"], optional = true }
native-tls = { version = "0.2.18", optional = true }
thiserror = { version = "2.0.21", optional = true }

# linux dependencies
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.15"
nix = { version = "0.31.3", features = ["sched", "ucontext", "process"], optional = true }

[dev-dependencies]
# crypto provider for the TLS tests; the library itself leaves the choice to the user
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
futures = "0.3.34"
local-sync = "0.1.1"
tempfile = "3.27.0"

[features]
# use nightly only feature flags
unstable = []
# async-cancel will push a async-cancel entry into sq when op is canceled
# strongly recommend to enable this feature
async-cancel = []
# enanle zero copy(enable SOCK_ZEROCOPY + MSG_ZEROCOPY flag)
# WARNING: this feature may cause performance degradation
zero-copy = []
# splice op(requires kernel 5.7+)
splice = []
# mkdirat2 op(requires kernel 5.15+)
mkdirat = []
# unlinkat op(requires kernel 5.11+)
unlinkat = []
# renameat op(requires kernel 5.11+)
renameat = []
# symlinkat op(requires kernel 5.15+)
symlinkat = []
# enable `async main` macros support
macros = ["monoio-macros"]
# allow waker to be sent across threads
sync = ["flume", "threadpool", "once_cell"]
# enable bind cpu set
utils = ["nix"]
# enable debug if you want to know what runtime does
debug = ["tracing"]
# signal enables setting ctrl_c handler
signal = ["ctrlc", "sync"]
signal-termination = ["signal", "ctrlc/termination"]
# TLS backends (monoio::tls::rustls / monoio::tls::native)
tls-rustls = ["rustls", "thiserror"]
tls-native = ["native-tls", "thiserror"]
# rustls crypto providers: pick one (or enable your own on `rustls`); no extra dependency needed
tls-rustls-ring = ["tls-rustls", "rustls/ring"]
tls-rustls-aws-lc-rs = ["tls-rustls", "rustls/aws_lc_rs"]
# native-tls: expose the negotiated ALPN protocol
tls-native-alpn = ["tls-native", "native-tls/alpn"]
# native-tls: build OpenSSL from source
tls-native-vendored = ["tls-native", "native-tls/vendored"]
default = ["async-cancel", "bytes", "macros", "utils"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
