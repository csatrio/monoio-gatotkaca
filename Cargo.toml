[workspace]

members = [
    "monoio",
    "monoio-macros",

    # Internal
    "examples",
]
resolver = "2"

[workspace.package]
authors = ["ChiHai <ihciah@gmail.com>", "XuShuai <dyxushuai@gmail.com>", "csatrio"]
edition = "2021"
keywords = ["runtime", "async", "io-uring", "thread-per-core", "zero-copy"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/csatrio/monoio-gatotkaca"

[workspace.dependencies]
# The proc macros must be their own crate; publish it before the runtime.
monoio-macros = { package = "adaptif-gatotkaca-monoio-macros", version = "0.2.0", path = "monoio-macros" }
monoio = { package = "adaptif-gatotkaca-monoio", version = "0.9.0", path = "monoio", default-features = false }
